[metadata]
name = fild-db
version = 0.1.1
author = Elena Kulgavaya
author_email = elena.kulgavaya@gmail.com
description = [DEPRECATED] Use surety-db instead. Operate with DB records using fild library
long_description = file: README.md, CHANGELOG.rst, LICENSE.rst
long_description_content_type = text/markdown
url = https://github.com/elenakulgavaya/fild-db
project_urls =
    Bug Tracker = https://github.com/elenakulgavaya/fild-db/issues
classifiers =
    Development Status :: 7 - Inactive
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages =
    fild_db
    fild_db.types
python_requires = >=3.9
install_requires =
    fild>=0.1.0
    fild-compare>=0.0.3
